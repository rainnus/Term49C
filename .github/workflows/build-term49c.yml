name: Build Term49C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build unsigned BAR
        shell: bash
        env:
          BBNDK_IMAGE: delaya73/bbndk:latest
        run: |
          chmod +x scripts/docker-build.sh
          chmod +x scripts/container-build.sh
          mkdir -p signing Device-Debug
          
          touch signing/bbpass
      
          chmod -R a+rwX "$GITHUB_WORKSPACE"
      
          ./scripts/docker-build.sh

      - name: Verify BAR
        shell: bash
        run: |
          test -s Term49C.bar
          sha256sum Term49C.bar

      - name: Upload BAR
        uses: actions/upload-artifact@v4
        with:
          name: Term49C-unsigned
          path: Term49C.bar
          if-no-files-found: error
          retention-days: 30
