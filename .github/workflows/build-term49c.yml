name: Build Term49C

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "external/**"
      - "share/**"
      - "icons/**"
      - "patches/**"
      - "scripts/**"
      - "SDL/**"
      - "TouchControlOverlay/**"
      - "libconfig/**"
      - ".gitmodules"
      - "Makefile"
      - "bar-descriptor.xml"
      - ".github/workflows/build-term49c.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Term49C BAR with patched SDL
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. Checkout
      #
      # Term49C 的 SDL / libconfig / TouchControlOverlay 都是 submodule。
      # 必须 recursive，否则 ./scripts/docker-build.sh sdl
      # 无法从真正的 term48 SDL 源码重新编译触控板补丁版 SDL。
      # ============================================================
      - name: Checkout Term49C with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify submodules
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Git submodules ==="
          git submodule status

          echo "=== SDL tree ==="
          test -d SDL
          test -n "$(find SDL -type f -print -quit)"
          ls -la SDL | head -30

          echo "=== Trackpad patch ==="
          test -s patches/sdl-term48-trackpad.patch
          ls -lh patches/sdl-term48-trackpad.patch

      # ============================================================
      # 2. 恢复 Term49 运行时资源
      #
      # 这里只从官方 Term49 BAR 提取：
      #   libconfig
      #   libTouchControlOverlay
      #   share/root
      #
      # !!! 不再复制 libSDL12.so !!!
      #
      # SDL 必须由下面的 docker-build.sh sdl 自己重新编译，
      # 否则可能把 Term49 原版 SDL 打进 Term49C。
      # ============================================================
      - name: Restore Term49 runtime except SDL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          mkdir -p external/lib
          mkdir -p share/root
          mkdir -p vendor-bar/unpacked

          gh release download 0.4.1.7 \
            --repo BerryFarm/Term49 \
            --pattern "*.bar" \
            --dir vendor-bar

          BAR_FILE="$(find vendor-bar -type f -name '*.bar' | head -n 1)"

          if [ -z "$BAR_FILE" ]; then
            echo "No Term49 BAR was downloaded"
            exit 1
          fi

          echo "Using upstream BAR: $BAR_FILE"

          unzip -q "$BAR_FILE" -d vendor-bar/unpacked

          CONFIG_LIB="$(
            find vendor-bar/unpacked \
              -type f \
              -name 'libconfig.so*' \
              | head -n 1
          )"

          TCO_LIB="$(
            find vendor-bar/unpacked \
              -type f \
              -name 'libTouchControlOverlay.so*' \
              | head -n 1
          )"

          ROOT_DIR="$(
            find vendor-bar/unpacked \
              -type d \
              -name root \
              | head -n 1
          )"

          if [ -z "$CONFIG_LIB" ]; then
            echo "libconfig was not found in upstream BAR"
            exit 1
          fi

          if [ -z "$TCO_LIB" ]; then
            echo "libTouchControlOverlay was not found in upstream BAR"
            exit 1
          fi

          if [ -z "$ROOT_DIR" ]; then
            echo "Runtime root directory was not found in upstream BAR"
            exit 1
          fi

          cp "$CONFIG_LIB" \
            external/lib/libconfig.so

          cp "$TCO_LIB" \
            external/lib/libTouchControlOverlay.so

          cp -a "$ROOT_DIR"/. share/root/

          test -s external/lib/libconfig.so
          test -s external/lib/libTouchControlOverlay.so
          test -n "$(find share/root -type f -print -quit)"

          # 重要：
          # 删除任何可能存在的旧 SDL。
          # 后面必须由 build-sdl.sh / docker-build.sh sdl 重新生成。
          rm -f external/lib/libSDL12.so
          rm -f external/lib/libSDL12.so.*

          echo "=== Restored libraries ==="
          ls -lh external/lib

          echo "=== Restored runtime ==="
          find share/root -maxdepth 3 -type f -print

      # ============================================================
      # 3. Build workspace
      # ============================================================
      - name: Prepare build workspace
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p signing
          mkdir -p Device-Debug

          touch signing/bbpass

          chmod +x scripts/docker-build.sh
          chmod +x scripts/container-build.sh
          chmod +x scripts/build-sdl.sh

          chmod -R a+rwX "$GITHUB_WORKSPACE"

      # ============================================================
      # 4. 强制重新编译 patched SDL
      #
      # 关键就是这个 sdl 参数：
      #
      # SDL term48 source
      #        +
      # patches/sdl-term48-trackpad.patch
      #        ↓
      # external/lib/libSDL12.so
      #        ↓
      # Term49C.bar
      # ============================================================
      - name: Build Term49C with Q20 trackpad SDL
        shell: bash
        env:
          BBNDK_IMAGE: delaya73/bbndk:latest
        run: |
          set -euxo pipefail

          echo "=== Before SDL build ==="

          if [ -e external/lib/libSDL12.so ]; then
            echo "ERROR: libSDL12.so already exists before patched SDL build"
            exit 1
          fi

          ./scripts/docker-build.sh sdl

      # ============================================================
      # 5. 确认 patched SDL 确实生成
      # ============================================================
      - name: Verify patched SDL
        shell: bash
        run: |
          set -euxo pipefail

          test -s external/lib/libSDL12.so

          echo "=== Newly compiled SDL ==="
          ls -lh external/lib/libSDL12.so
          file external/lib/libSDL12.so
          sha256sum external/lib/libSDL12.so \
            | tee libSDL12.so.sha256

      # ============================================================
      # 6. 验证最终 BAR
      # ============================================================
      - name: Verify Term49C BAR
        shell: bash
        run: |
          set -euxo pipefail

          test -s Device-Debug/Term49
          test -s Term49C.bar

          echo "=== Compiled executable ==="
          ls -lh Device-Debug/Term49
          file Device-Debug/Term49

          echo "=== Generated BAR ==="
          ls -lh Term49C.bar

          sha256sum Term49C.bar \
            | tee Term49C.bar.sha256

      # ============================================================
      # 7. 最重要的验证：
      #
      # 把 BAR 解开，再检查 BAR 内真正打进去的 SDL
      # 是否和刚刚重新编译的 patched SDL 完全一致。
      #
      # 防止出现：
      #   external/lib 是新版
      #   但 BAR 里却还是旧版
      # ============================================================
      - name: Verify SDL packaged inside BAR
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf verify-bar
          mkdir -p verify-bar

          unzip -q Term49C.bar -d verify-bar

          BAR_SDL="$(
            find verify-bar \
              -type f \
              -name 'libSDL12.so*' \
              | head -n 1
          )"

          if [ -z "$BAR_SDL" ]; then
            echo "ERROR: libSDL12.so was not packaged inside Term49C.bar"
            find verify-bar -maxdepth 5 -type f -print
            exit 1
          fi

          echo "SDL packaged in BAR:"
          ls -lh "$BAR_SDL"

          echo "=== Source SDL hash ==="
          sha256sum external/lib/libSDL12.so

          echo "=== BAR SDL hash ==="
          sha256sum "$BAR_SDL"

          cmp \
            external/lib/libSDL12.so \
            "$BAR_SDL"

          echo "OK: patched SDL in BAR matches newly compiled SDL"

      # ============================================================
      # 8. Build info
      # ============================================================
      - name: Create build information
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "Term49C build"
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "Submodules:"
            git submodule status
            echo
            echo "Term49C BAR:"
            sha256sum Term49C.bar
            echo
            echo "Patched SDL:"
            sha256sum external/lib/libSDL12.so
          } > build-info.txt

          cat build-info.txt

      # ============================================================
      # 9. Upload
      # ============================================================
      - name: Upload Term49C artifact
        uses: actions/upload-artifact@v4
        with:
          name: Term49C-Q20-trackpad-${{ github.run_number }}
          path: |
            Term49C.bar
            Term49C.bar.sha256
            libSDL12.so.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
