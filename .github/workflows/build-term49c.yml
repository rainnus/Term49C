name: Build Term49C

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "external/**"
      - "share/**"
      - "icons/**"
      - "patches/**"
      - "scripts/**"
      - "SDL/**"
      - "TouchControlOverlay/**"
      - "libconfig/**"
      - ".gitmodules"
      - "Makefile"
      - "bar-descriptor.xml"
      - ".github/workflows/build-term49c.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Term49C BAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ------------------------------------------------------------
      # Checkout + submodules
      # ------------------------------------------------------------
      - name: Checkout Term49C
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Commit ==="
          git rev-parse HEAD

          echo "=== Submodules ==="
          git submodule status

          echo "=== SDL ==="
          test -d SDL
          test -n "$(find SDL -type f -print -quit)"

          echo "=== Trackpad patch ==="
          test -s patches/sdl-term48-trackpad.patch
          ls -lh patches/sdl-term48-trackpad.patch


      # ------------------------------------------------------------
      # 从官方 Term49 BAR 恢复 Term49C 仓库缺少的 runtime
      #
      # 注意：
      # 不提取 SDL！
      # SDL 后面由源码 + Q20 trackpad patch 重新编译。
      # ------------------------------------------------------------
      - name: Restore Term49 runtime and libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          mkdir -p external/lib
          mkdir -p share/root
          mkdir -p vendor-bar/unpacked

          gh release download 0.4.1.7 \
            --repo BerryFarm/Term49 \
            --pattern "*.bar" \
            --dir vendor-bar

          BAR_FILE="$(find vendor-bar -type f -name '*.bar' | head -n 1)"

          if [ -z "$BAR_FILE" ]; then
            echo "No Term49 BAR was downloaded"
            exit 1
          fi

          echo "Using upstream BAR: $BAR_FILE"

          unzip -q "$BAR_FILE" -d vendor-bar/unpacked

          CONFIG_LIB="$(
            find vendor-bar/unpacked \
              -type f \
              -name 'libconfig.so*' \
              | head -n 1
          )"

          TCO_LIB="$(
            find vendor-bar/unpacked \
              -type f \
              -name 'libTouchControlOverlay.so*' \
              | head -n 1
          )"

          ROOT_DIR="$(
            find vendor-bar/unpacked \
              -type d \
              -name root \
              | head -n 1
          )"

          if [ -z "$CONFIG_LIB" ]; then
            echo "libconfig was not found"
            exit 1
          fi

          if [ -z "$TCO_LIB" ]; then
            echo "libTouchControlOverlay was not found"
            exit 1
          fi

          if [ -z "$ROOT_DIR" ]; then
            echo "Runtime root directory was not found"
            exit 1
          fi

          cp "$CONFIG_LIB" \
            external/lib/libconfig.so

          cp "$TCO_LIB" \
            external/lib/libTouchControlOverlay.so

          cp -a "$ROOT_DIR"/. share/root/

          test -s external/lib/libconfig.so
          test -s external/lib/libTouchControlOverlay.so
          test -n "$(find share/root -type f -print -quit)"

          # 不允许旧 Term49 SDL 混进来
          rm -f external/lib/libSDL12.so
          rm -f external/lib/libSDL12.so.*

          echo "=== external/lib before SDL build ==="
          ls -lh external/lib


      # ------------------------------------------------------------
      # Prepare
      # ------------------------------------------------------------
      - name: Prepare build workspace
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p signing
          mkdir -p Device-Debug

          touch signing/bbpass

          chmod +x scripts/docker-build.sh
          chmod +x scripts/container-build.sh
          chmod +x scripts/build-sdl.sh

          chmod -R a+rwX "$GITHUB_WORKSPACE"


      # ------------------------------------------------------------
      # 关键步骤
      #
      # 不再调用：
      #
      #   docker-build.sh sdl
      #
      # 而是直接进入 BBNDK Docker，
      # source NDK 环境，
      # 手动执行 build-sdl.sh。
      #
      # 这样 SDL 一定在 Term49 之前生成。
      # ------------------------------------------------------------
      - name: Build patched Q20 SDL
        shell: bash
        env:
          BBNDK_IMAGE: delaya73/bbndk:latest
        run: |
          set -euxo pipefail

          echo "=== Starting dedicated SDL build ==="

          docker run --rm \
            --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            "$BBNDK_IMAGE" \
            /bin/bash -lc '
              set -euxo pipefail

              BBNDK_ENV="/home/admin/bin/bbndk/bbndk-env_10_3_1_995.sh"

              if [ ! -f "$BBNDK_ENV" ]; then
                echo "ERROR: BBNDK environment not found:"
                echo "$BBNDK_ENV"
                exit 1
              fi

              echo "Using BBNDK environment:"
              echo "$BBNDK_ENV"

              source "$BBNDK_ENV"

              echo "=== Building patched SDL ==="

              chmod +x scripts/build-sdl.sh
              scripts/build-sdl.sh

              echo "=== SDL build finished ==="

              test -s external/lib/libSDL12.so

              ls -lh external/lib/libSDL12.so
              file external/lib/libSDL12.so
            '


      # ------------------------------------------------------------
      # 检查 patch 是否真的进 SDL 源码
      # ------------------------------------------------------------
      - name: Verify patched SDL
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Check trackpad code ==="

          grep -n "handleTrackpadEvent" \
            SDL/src/video/playbook/SDL_playbookevents.c

          echo "=== Check SDL output ==="

          test -s external/lib/libSDL12.so

          ls -lh external/lib/libSDL12.so
          file external/lib/libSDL12.so

          sha256sum external/lib/libSDL12.so \
            | tee libSDL12.so.sha256


      # ------------------------------------------------------------
      # 现在 SDL 已经肯定存在
      #
      # 这里执行普通 build，不再传 sdl
      # ------------------------------------------------------------
      - name: Build Term49C
        shell: bash
        env:
          BBNDK_IMAGE: delaya73/bbndk:latest
        run: |
          set -euxo pipefail

          echo "=== Libraries before Term49 build ==="

          ls -lh external/lib

          test -s external/lib/libSDL12.so
          test -s external/lib/libconfig.so
          test -s external/lib/libTouchControlOverlay.so

          ./scripts/docker-build.sh


      # ------------------------------------------------------------
      # 检查程序和 BAR
      # ------------------------------------------------------------
      - name: Verify output
        shell: bash
        run: |
          set -euxo pipefail

          test -s Device-Debug/Term49
          test -s Term49C.bar

          echo "=== Executable ==="

          ls -lh Device-Debug/Term49
          file Device-Debug/Term49

          echo "=== BAR ==="

          ls -lh Term49C.bar

          sha256sum Term49C.bar \
            | tee Term49C.bar.sha256


      # ------------------------------------------------------------
      # 解开最终 BAR
      # 检查里面实际包含的 SDL 是不是我们刚刚重新编的
      # ------------------------------------------------------------
      - name: Verify SDL inside BAR
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf verify-bar
          mkdir verify-bar

          unzip -q Term49C.bar -d verify-bar

          BAR_SDL="$(
            find verify-bar \
              -type f \
              -name 'libSDL12.so*' \
              | head -n 1
          )"

          if [ -z "$BAR_SDL" ]; then
            echo "ERROR: libSDL12.so missing from BAR"

            find verify-bar \
              -maxdepth 5 \
              -type f \
              -print

            exit 1
          fi

          echo "=== SDL generated from source ==="
          sha256sum external/lib/libSDL12.so

          echo "=== SDL packaged in BAR ==="
          sha256sum "$BAR_SDL"

          cmp \
            external/lib/libSDL12.so \
            "$BAR_SDL"

          echo
          echo "============================================"
          echo "OK: patched Q20 SDL is packaged in Term49C"
          echo "============================================"


      # ------------------------------------------------------------
      # Build metadata
      # ------------------------------------------------------------
      - name: Create build info
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "Term49C Q20 trackpad build"
            echo

            echo "Main commit:"
            git rev-parse HEAD
            echo

            echo "Submodules:"
            git submodule status
            echo

            echo "BAR:"
            sha256sum Term49C.bar
            echo

            echo "SDL:"
            sha256sum external/lib/libSDL12.so

          } > build-info.txt

          cat build-info.txt


      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload Term49C artifact
        uses: actions/upload-artifact@v4
        with:
          name: Term49C-Q20-trackpad-${{ github.run_number }}
          path: |
            Term49C.bar
            Term49C.bar.sha256
            libSDL12.so.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
