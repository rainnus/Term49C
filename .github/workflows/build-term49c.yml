name: Build Term49C

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "external/**"
      - "share/**"
      - "icons/**"
      - "patches/**"
      - "scripts/**"
      - "Makefile"
      - "bar-descriptor.xml"
      - ".github/workflows/build-term49c.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Term49C BAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Term49C
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 当前 Term49C 仓库缺少预编译共享库和 share/root。
      # 从 BerryFarm 官方 Term49 BAR 中提取兼容文件。
      - name: Restore Term49 runtime and libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          mkdir -p external/lib
          mkdir -p share/root
          mkdir -p vendor-bar/unpacked

          gh release download 0.4.1.7 \
            --repo BerryFarm/Term49 \
            --pattern "*.bar" \
            --dir vendor-bar

          BAR_FILE="$(find vendor-bar -type f -name '*.bar' | head -n 1)"

          if [ -z "$BAR_FILE" ]; then
            echo "No Term49 BAR was downloaded"
            exit 1
          fi

          echo "Using upstream BAR: $BAR_FILE"

          unzip -q "$BAR_FILE" -d vendor-bar/unpacked

          CONFIG_LIB="$(
            find vendor-bar/unpacked \
              -type f \
              -name 'libconfig.so*' \
              | head -n 1
          )"

          SDL_LIB="$(
            find vendor-bar/unpacked \
              -type f \
              -name 'libSDL12.so*' \
              | head -n 1
          )"

          TCO_LIB="$(
            find vendor-bar/unpacked \
              -type f \
              -name 'libTouchControlOverlay.so*' \
              | head -n 1
          )"

          ROOT_DIR="$(
            find vendor-bar/unpacked \
              -type d \
              -name root \
              | head -n 1
          )"

          if [ -z "$CONFIG_LIB" ]; then
            echo "libconfig was not found in upstream BAR"
            find vendor-bar/unpacked -maxdepth 5 -print
            exit 1
          fi

          if [ -z "$SDL_LIB" ]; then
            echo "libSDL12 was not found in upstream BAR"
            find vendor-bar/unpacked -maxdepth 5 -print
            exit 1
          fi

          if [ -z "$TCO_LIB" ]; then
            echo "libTouchControlOverlay was not found in upstream BAR"
            find vendor-bar/unpacked -maxdepth 5 -print
            exit 1
          fi

          if [ -z "$ROOT_DIR" ]; then
            echo "Runtime root directory was not found in upstream BAR"
            find vendor-bar/unpacked -maxdepth 5 -print
            exit 1
          fi

          cp "$CONFIG_LIB" \
            external/lib/libconfig.so

          cp "$SDL_LIB" \
            external/lib/libSDL12.so

          cp "$TCO_LIB" \
            external/lib/libTouchControlOverlay.so

          cp -a "$ROOT_DIR"/. share/root/

          test -s external/lib/libconfig.so
          test -s external/lib/libSDL12.so
          test -s external/lib/libTouchControlOverlay.so
          test -n "$(find share/root -type f -print -quit)"

          echo "Restored libraries:"
          ls -lh external/lib

          echo "Restored runtime:"
          find share/root -maxdepth 3 -type f -print

      # Makefile 会读取 signing/bbpass。
      # 未签名 CI 构建不需要其中的设备或签名信息。
      - name: Prepare build workspace
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p signing
          mkdir -p Device-Debug

          touch signing/bbpass

          chmod +x scripts/docker-build.sh
          chmod +x scripts/container-build.sh
          chmod +x scripts/build-sdl.sh

          # 容器内 admin 用户需要向挂载的工作区写入
          # .o、Term49 和 Term49C.bar。
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      # sdl 参数会重新编译带 Q20 触控板补丁的 libSDL12。
      - name: Build Term49C
        shell: bash
        env:
          BBNDK_IMAGE: delaya73/bbndk:latest
        run: |
          set -euxo pipefail

          ./scripts/docker-build.sh sdl

      - name: Verify output
        shell: bash
        run: |
          set -euxo pipefail

          test -s Device-Debug/Term49
          test -s Term49C.bar

          echo "Compiled executable:"
          ls -lh Device-Debug/Term49
          file Device-Debug/Term49

          echo "Generated BAR:"
          ls -lh Term49C.bar

          sha256sum Term49C.bar \
            | tee Term49C.bar.sha256

      - name: Upload Term49C artifact
        uses: actions/upload-artifact@v4
        with:
          name: Term49C-unsigned-${{ github.run_number }}
          path: |
            Term49C.bar
            Term49C.bar.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
