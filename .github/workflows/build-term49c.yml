name: Build Term49C

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "external/**"
      - "share/**"
      - "icons/**"
      - "patches/**"
      - "scripts/**"

      # 同时匹配子模块 gitlink 和子模块目录内容
      - "SDL"
      - "SDL/**"
      - "TouchControlOverlay"
      - "TouchControlOverlay/**"
      - "libconfig"
      - "libconfig/**"

      - ".gitmodules"
      - ".gitattributes"
      - "Makefile"
      - "bar-descriptor.xml"
      - ".github/workflows/build-term49c.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Term49C BAR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BBNDK_IMAGE: delaya73/bbndk:latest
      BBNDK_ENV: /home/admin/bin/bbndk/bbndk-env_10_3_1_995.sh

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout Term49C
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Verify repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Commit ==="
          git rev-parse HEAD

          echo "=== Submodules ==="
          git submodule status

          echo "=== SDL ==="
          test -d SDL
          test -n "$(find SDL -type f -print -quit)"

          echo "=== Trackpad patch ==="
          test -s patches/sdl-term48-trackpad.patch
          ls -lh patches/sdl-term48-trackpad.patch

          echo "=== Required font ==="
          if [ ! -s external/fonts/CascadiaMonoPL-Regular.ttf ]; then
            echo "::error::Missing external/fonts/CascadiaMonoPL-Regular.ttf"
            echo "Available font files:"
            find . -type f \( -iname '*.ttf' -o -iname '*.otf' \) -print
            exit 1
          fi

          ls -lh external/fonts/CascadiaMonoPL-Regular.ttf

          echo "=== Git LFS status ==="
          git lfs ls-files || true

      # ------------------------------------------------------------
      # 从官方 Term49 BAR 恢复仓库没有包含的运行文件和共享库。
      #
      # SDL 不从 BAR 提取，后面使用源码和 Q20 补丁重新编译。
      # ------------------------------------------------------------
      - name: Restore Term49 runtime and libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          rm -rf vendor-bar
          mkdir -p vendor-bar/unpacked
          mkdir -p external/lib
          mkdir -p share/root

          gh release download 0.4.1.7 \
            --repo BerryFarm/Term49 \
            --pattern "*.bar" \
            --dir vendor-bar

          mapfile -t BAR_FILES < <(
            find vendor-bar \
              -maxdepth 1 \
              -type f \
              -name '*.bar' \
              -print
          )

          if [ "${#BAR_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one upstream BAR, found ${#BAR_FILES[@]}"
            printf '%s\n' "${BAR_FILES[@]}"
            exit 1
          fi

          BAR_FILE="${BAR_FILES[0]}"

          echo "=== Upstream BAR ==="
          ls -lh "$BAR_FILE"
          sha256sum "$BAR_FILE"

          unzip -q "$BAR_FILE" -d vendor-bar/unpacked

          mapfile -t CONFIG_LIBS < <(
            find vendor-bar/unpacked \
              -type f \
              -name 'libconfig.so*' \
              -print
          )

          mapfile -t TCO_LIBS < <(
            find vendor-bar/unpacked \
              -type f \
              -name 'libTouchControlOverlay.so*' \
              -print
          )

          mapfile -t ROOT_DIRS < <(
            find vendor-bar/unpacked \
              -type d \
              -name root \
              -print
          )

          if [ "${#CONFIG_LIBS[@]}" -lt 1 ]; then
            echo "::error::libconfig was not found in upstream BAR"
            exit 1
          fi

          if [ "${#TCO_LIBS[@]}" -lt 1 ]; then
            echo "::error::libTouchControlOverlay was not found in upstream BAR"
            exit 1
          fi

          if [ "${#ROOT_DIRS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one runtime root directory, found ${#ROOT_DIRS[@]}"
            printf '%s\n' "${ROOT_DIRS[@]}"
            exit 1
          fi

          CONFIG_LIB="${CONFIG_LIBS[0]}"
          TCO_LIB="${TCO_LIBS[0]}"
          ROOT_DIR="${ROOT_DIRS[0]}"

          echo "Using libconfig: $CONFIG_LIB"
          echo "Using TouchControlOverlay: $TCO_LIB"
          echo "Using runtime root: $ROOT_DIR"

          install -m 0644 \
            "$CONFIG_LIB" \
            external/lib/libconfig.so

          install -m 0644 \
            "$TCO_LIB" \
            external/lib/libTouchControlOverlay.so

          cp -a "$ROOT_DIR"/. share/root/

          test -s external/lib/libconfig.so
          test -s external/lib/libTouchControlOverlay.so
          test -n "$(find share/root -type f -print -quit)"

          # 不允许上游 BAR 中的旧 SDL 参与最终构建
          rm -f external/lib/libSDL12.so
          rm -f external/lib/libSDL12.so.*

          echo "=== Restored libraries ==="
          ls -lh external/lib

          echo "=== Restored runtime ==="
          find share/root -maxdepth 4 -type f -print | sort

      # ------------------------------------------------------------
      # Prepare
      # ------------------------------------------------------------
      - name: Prepare build workspace
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p signing
          mkdir -p Device-Debug

          # Makefile 会包含该文件；无签名构建使用空文件
          : > signing/bbpass

          chmod +x scripts/docker-build.sh
          chmod +x scripts/container-build.sh
          chmod +x scripts/build-sdl.sh

          # BBNDK 容器用户可能与 GitHub runner UID 不同
          chmod -R a+rwX \
            external \
            share \
            signing \
            Device-Debug \
            SDL

      # ------------------------------------------------------------
      # 在 BBNDK 容器中编译打过 Q20 trackpad 补丁的 SDL。
      #
      # 旧版 bbndk-env 脚本直接访问 $1，因此 source 时必须临时关闭
      # nounset，否则会出现 "$1: unbound variable"。
      # ------------------------------------------------------------
      - name: Build patched Q20 SDL
        shell: bash
        run: |
          set -euxo pipefail
      
          echo "=== Starting dedicated SDL build ==="
      
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/bbndk-home \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            "$BBNDK_IMAGE" \
            /bin/bash -lc '
              set -eo pipefail
              set -x
      
              mkdir -p "$HOME"
      
              BBNDK_ENV="/home/admin/bin/bbndk/bbndk-env_10_3_1_995.sh"
      
              if [ ! -f "$BBNDK_ENV" ]; then
                echo "ERROR: BBNDK environment not found: $BBNDK_ENV"
                exit 1
              fi
      
              set +u
              source "$BBNDK_ENV"
              set -u
      
              echo "QNX_HOST=$QNX_HOST"
              echo "QNX_TARGET=$QNX_TARGET"
              command -v qcc
      
              echo "=== Remove stale SDL configure outputs ==="
              rm -f SDL/config.status
              rm -f SDL/config.log
              rm -f SDL/config.cache
              rm -f SDL/Makefile
      
              find SDL -type f -name "*.o" -delete
              find SDL -type f -name "*.lo" -delete
              find SDL -type f -name "*.la" -delete
      
              echo "=== Building patched SDL ==="
              /bin/bash scripts/build-sdl.sh
      
              echo "=== SDL build finished ==="
              test -s external/lib/libSDL12.so
              ls -lh external/lib/libSDL12.so
              file external/lib/libSDL12.so
            '
      # ------------------------------------------------------------
      # 验证补丁和 SDL 构建产物
      # ------------------------------------------------------------
      - name: Verify patched SDL
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Check trackpad implementation ==="

          if ! grep -n \
            "handleTrackpadEvent" \
            SDL/src/video/playbook/SDL_playbookevents.c
          then
            echo "::error::Q20 trackpad code was not found in SDL source"
            exit 1
          fi

          echo "=== Check SDL output ==="
          test -s external/lib/libSDL12.so
          ls -lh external/lib/libSDL12.so
          file external/lib/libSDL12.so

          sha256sum external/lib/libSDL12.so \
            | tee libSDL12.so.sha256

      # ------------------------------------------------------------
      # 编译 Term49C
      #
      # SDL 已经生成，所以不向 docker-build.sh 传入 sdl 参数。
      # ------------------------------------------------------------
      - name: Build Term49C
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Required assets before build ==="
          test -s external/fonts/CascadiaMonoPL-Regular.ttf
          test -n "$(find share/root -type f -print -quit)"

          echo "=== Libraries before Term49 build ==="
          test -s external/lib/libSDL12.so
          test -s external/lib/libconfig.so
          test -s external/lib/libTouchControlOverlay.so
          ls -lh external/lib

          ./scripts/docker-build.sh

      # ------------------------------------------------------------
      # 检查主程序和 BAR
      # ------------------------------------------------------------
      - name: Verify output
        shell: bash
        run: |
          set -euxo pipefail

          test -s Device-Debug/Term49
          test -s Term49C.bar

          echo "=== Executable ==="
          ls -lh Device-Debug/Term49
          file Device-Debug/Term49

          echo "=== BAR ==="
          ls -lh Term49C.bar
          file Term49C.bar

          sha256sum Term49C.bar \
            | tee Term49C.bar.sha256

      # ------------------------------------------------------------
      # 解开最终 BAR，并确认使用的是本次构建的 SDL。
      # ------------------------------------------------------------
      - name: Verify SDL and font inside BAR
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf verify-bar
          mkdir -p verify-bar

          unzip -q Term49C.bar -d verify-bar

          mapfile -t BAR_SDL_FILES < <(
            find verify-bar \
              -type f \
              -name 'libSDL12.so*' \
              -print
          )

          if [ "${#BAR_SDL_FILES[@]}" -lt 1 ]; then
            echo "::error::libSDL12.so is missing from final BAR"
            find verify-bar -maxdepth 6 -type f -print | sort
            exit 1
          fi

          BAR_SDL="${BAR_SDL_FILES[0]}"

          echo "=== SDL generated from source ==="
          sha256sum external/lib/libSDL12.so

          echo "=== SDL packaged in BAR ==="
          sha256sum "$BAR_SDL"

          cmp \
            external/lib/libSDL12.so \
            "$BAR_SDL"

          mapfile -t BAR_FONT_FILES < <(
            find verify-bar \
              -type f \
              -name 'CascadiaMonoPL-Regular.ttf' \
              -print
          )

          if [ "${#BAR_FONT_FILES[@]}" -lt 1 ]; then
            echo "::error::CascadiaMonoPL-Regular.ttf is missing from final BAR"
            find verify-bar -maxdepth 6 -type f -print | sort
            exit 1
          fi

          BAR_FONT="${BAR_FONT_FILES[0]}"

          echo "=== Source font ==="
          sha256sum external/fonts/CascadiaMonoPL-Regular.ttf

          echo "=== Font packaged in BAR ==="
          sha256sum "$BAR_FONT"

          cmp \
            external/fonts/CascadiaMonoPL-Regular.ttf \
            "$BAR_FONT"

          echo
          echo "============================================"
          echo "OK: patched Q20 SDL is packaged in Term49C"
          echo "OK: Cascadia Mono PL font is packaged"
          echo "============================================"

      # ------------------------------------------------------------
      # Build metadata
      # ------------------------------------------------------------
      - name: Create build info
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "Term49C Q20 trackpad build"
            echo

            echo "Main commit:"
            git rev-parse HEAD
            echo

            echo "Submodules:"
            git submodule status
            echo

            echo "BBNDK image:"
            echo "$BBNDK_IMAGE"
            echo

            echo "BAR:"
            sha256sum Term49C.bar
            echo

            echo "SDL:"
            sha256sum external/lib/libSDL12.so
            echo

            echo "Font:"
            sha256sum external/fonts/CascadiaMonoPL-Regular.ttf
          } > build-info.txt

          cat build-info.txt

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload Term49C artifact
        uses: actions/upload-artifact@v4
        with:
          name: Term49C-Q20-trackpad-${{ github.run_number }}
          path: |
            Term49C.bar
            Term49C.bar.sha256
            libSDL12.so.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
